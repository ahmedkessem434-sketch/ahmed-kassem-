
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaLearn</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>

    <div id="loginPage" class="login-page">
        <div class="card">
            <h1>📚 VocaLearn</h1>
            <p class="subtitle">Deine Vokabeln. Dein Fortschritt.</p>

            <form id="loginForm">
                <input id="email" type="email"
                    placeholder="E-Mail-Adresse"
                    autocomplete="email" required>

                <input id="password" type="password"
                    placeholder="Passwort (mind. 6 Zeichen)"
                    autocomplete="current-password"
                    minlength="6" required>

                <button type="submit">Einloggen</button>
            </form>

            <button id="registerButton" type="button">
                Neues Konto erstellen
            </button>

            <p id="loginMessage" role="status"></p>
        </div>
    </div>

    <div id="appPage" class="hidden">
        <header>
            <h1>📚 VocaLearn</h1>
            <button id="logoutButton" type="button">Abmelden</button>
        </header>

        <main>
            <section class="welcome">
                <h2>Deine Vokabeln</h2>
                <p>Willkommen bei VocaLearn! Lerne neue Wörter und verbessere dein Englisch.</p>
                <p id="userEmail"></p>
                <p id="status" role="status"></p>
            </section>

            <section>
                <h2>Neue Vokabel</h2>

                <form id="wordForm">
                    <div class="inputs">
                        <input id="word1"
                            placeholder="Deutsch, z. B. Haus" required>

                        <input id="word2"
                            placeholder="Englisch, z. B. house" required>
                    </div>

                    <button type="submit">+ Vokabel hinzufügen</button>
                </form>
            </section>

            <section>
                <h2>Gespeicherte Vokabeln</h2>
                <div id="wordList"></div>
            </section>

            <section>
                <h2>🧠 Lernen</h2>

                <div id="question">
                    Klicke auf „Nächste Vokabel“, um zu starten.
                </div>

                <form id="answerForm">
                    <input id="answer"
                        placeholder="Deine Antwort"
                        autocomplete="off">

                    <button type="submit">Antwort prüfen</button>
                </form>

                <p id="result" role="status"></p>

                <button id="nextButton" type="button">
                    Nächste Vokabel
                </button>
            </section>
        </main>
    </div>

</body>
</html>
